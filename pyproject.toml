[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blenderproc-render-ui"
version = "1.1.0"
description = "Local BlenderProc scene configuration and independent render jobs"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2", "trimesh>=4.4,<5", "PyYAML>=6,<7", "Pillow>=9,<12",
]

[project.optional-dependencies]
ui = ["PySide6>=6.8,<6.9", "vispy>=0.15,<0.16"]
gui = ["PySide6>=6.8,<6.9", "vispy>=0.15,<0.16"]
dev = ["PySide6>=6.8,<6.9", "vispy>=0.15,<0.16", "pytest>=8.4,<9", "pytest-qt>=4.5,<5"]

[project.scripts]
bproc-ui = "bproc_ui.app:main"
blenderproc-ui = "bproc_ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bproc_export = ["templates/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["blender: requires the actual Blender runtime", "ui: requires Qt"]
# ROS ships pytest plugins as setuptools entry points; they fail to import in this venv and
# break collection before a single project test runs. Only the Qt plugin is wanted here.
addopts = ["-p", "no:launch_ros", "-p", "no:launch_testing", "-p", "no:ament_lint",
           "-p", "no:ament_flake8", "-p", "no:ament_pep257", "-p", "no:ament_copyright",
           "-p", "no:ament_xmllint"]
